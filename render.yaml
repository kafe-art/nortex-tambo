services:
  - type: web
    name: nortex-tambo
    runtime: static
    buildCommand: npm test
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
